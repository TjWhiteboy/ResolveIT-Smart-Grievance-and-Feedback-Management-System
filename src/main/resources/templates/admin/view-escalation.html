<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Escalation – ResolveIT Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <style>
        .view-grid { display: grid; grid-template-columns: minmax(0, 2fr) 350px; gap: 2rem; align-items: flex-start; }
        .detail-section { margin-bottom: 2.5rem; }
        .detail-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; display: block; }
        .detail-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        
        .action-panel { position: sticky; top: 2rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: var(--shadow-md); padding: 1.5rem; }
        
        .attachment-preview { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 1rem; position: relative; max-width: 400px; }
        .attachment-preview img { width: 100%; display: block; transition: transform 0.3s; }
        .attachment-preview:hover img { transform: scale(1.02); }
        .pdf-pill { display: flex; align-items: center; gap: 12px; background: #fef2f2; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; color: #991b1b; text-decoration: none; font-weight: 600; }
        
        .status-pill { border-radius: 6px; padding: 4px 10px; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; }
        .status-open { background: #dbeafe; color: #1e40af; }
        .status-in-review { background: #ffedd5; color: #9a3412; }
        .status-approved { background: #f3e8ff; color: #6b21a8; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-resolved { background: #dcfce7; color: #166534; }

        /* Dark Mode Adjustments */
        [data-theme="dark"] .status-open { background: rgba(30, 64, 175, 0.2); color: #93c5fd; }
        [data-theme="dark"] .status-in-review { background: rgba(154, 52, 18, 0.2); color: #fdba74; }
        [data-theme="dark"] .status-resolved { background: rgba(22, 101, 52, 0.2); color: #86efac; }
        [data-theme="dark"] .status-rejected { background: rgba(153, 27, 27, 0.2); color: #fca5a5; }
        
        [data-theme="dark"] .detail-card[style*="background:#fffcf2"] {
            background: rgba(180, 83, 9, 0.1) !important;
            border-color: #334155 !important;
        }
        [data-theme="dark"] [style*="color:#b45309"],
        [data-theme="dark"] [style*="color:#92400e"],
        [data-theme="dark"] [style*="color:#78350f"] {
            color: #fdba74 !important;
        }
        [data-theme="dark"] textarea[style*="border:1px solid #fca5a5"] {
            background: #0f172a;
            border-color: #ef4444 !important;
            color: #f1f5f9;
        }
    </style>

</head>
<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <div class="app-container">
        <aside th:replace="~{fragments/sidebar :: sidebar('sla')}"></aside>
        
        <main class="main-content animate-fade">
            <!-- Header -->
            <div style="margin-bottom:2.5rem; display:flex; justify-content:space-between; align-items:flex-end;">
                <div>
                    <div style="display:flex; align-items:center; gap:0.5rem; font-size:0.85rem; color:var(--text-muted); margin-bottom:0.75rem;">
                        <a th:href="@{/admin/sla}" style="color:inherit; text-decoration:none;">Escalations</a>
                        <span>/</span>
                        <span style="color:var(--text-main); font-weight:700;" th:text="'E-'+${escalation.id}"></span>
                    </div>
                    <h1 style="font-size:2rem; font-weight:800;" th:text="${escalation.complaint.title}">Escalation Subject</h1>
                </div>
                <div>
                    <span class="status-pill" 
                          th:classappend="'status-' + ${#strings.toLowerCase(#strings.replace(escalation.status, '_', '-'))}" 
                          style="font-size:1rem; padding:8px 20px;"
                          th:text="${escalation.status}"></span>
                </div>
            </div>

            <div th:if="${success}" class="alert alert-success" style="padding:1rem; background:#dcfce7; color:#166534; border-radius:10px; margin-bottom:2rem;">
                <i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span>
            </div>

            <div class="view-grid">
                <div class="details-column">
                    <!-- Section 1: Complaint Core -->
                    <div class="detail-section">
                        <label class="detail-label">Original Complaint Details</label>
                        <div class="detail-card">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2rem; margin-bottom:1.5rem;">
                                <div>
                                    <p style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">PRIORITY</p>
                                    <span class="badge" th:style="'background:' + (${escalation.complaint.priority == 'High' ? '#fee2e2; color:#ef4444;' : '#f3f4f6; color:#1f2937;'})" th:text="${escalation.complaint.priority}"></span>
                                </div>
                                <div>
                                    <p style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">CATEGORY</p>
                                    <p style="font-weight:700; font-size:1rem;" th:text="${escalation.complaint.category}"></p>
                                </div>
                            </div>
                            <p style="font-size:0.7rem; color:var(--text-muted); font-weight:700; margin-bottom:0.5rem;">DESCRIPTION</p>
                            <p th:text="${escalation.complaint.description}" style="line-height:1.6; color:var(--text-main);"></p>
                            
                            <!-- Attachment Logic -->
                            <div th:if="${escalation.complaint.attachmentPath != null}" style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid var(--border-color);">
                                <label class="detail-label">Attached Document</label>
                                <div th:if="${#strings.contains(escalation.complaint.attachmentPath.toLowerCase(), '.jpg') or #strings.contains(escalation.complaint.attachmentPath.toLowerCase(), '.png') or #strings.contains(escalation.complaint.attachmentPath.toLowerCase(), '.jpeg')}" class="attachment-preview">
                                    <img th:src="${escalation.complaint.attachmentPath}" alt="Attachment">
                                </div>
                                <div th:if="${#strings.contains(escalation.complaint.attachmentPath.toLowerCase(), '.pdf')}" style="max-width:300px;">
                                    <a th:href="${escalation.complaint.attachmentPath}" class="pdf-pill" target="_blank">
                                        <i class="fa-solid fa-file-pdf" style="font-size:1.5rem;"></i>
                                        <span>Download Complaint PDF</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Section 2: Stakeholders -->
                    <div class="detail-section" style="display:grid; grid-template-columns: 1fr 1fr; gap:2rem;">
                        <div>
                            <label class="detail-label">End User (Complainant)</label>
                            <div class="detail-card">
                                <p style="font-weight:700; font-size:1rem;" th:text="${escalation.complaint.userName}"></p>
                                <p style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;">ID #<span th:text="${escalation.complaint.userId}"></span></p>
                            </div>
                        </div>
                        <div>
                            <label class="detail-label">Raised By (Staff)</label>
                            <div class="detail-card">
                                <p th:if="${escalation.raisedBy != null}" style="font-weight:700; font-size:1rem;" th:text="${escalation.raisedBy.name}"></p>
                                <p th:if="${escalation.raisedBy != null}" style="font-size:0.8rem; color:var(--text-muted); margin-top:4px;" th:text="${escalation.raisedBy.email}"></p>
                                <p th:unless="${escalation.raisedBy != null}" style="font-weight:700; font-size:1rem; color:var(--text-muted); font-style:italic;">Unknown Staff (ID: 0)</p>
                            </div>
                        </div>
                    </div>

                    <!-- Section 3: Escalation Logic -->
                    <div class="detail-section">
                        <label class="detail-label">Escalation Justification</label>
                        <div class="detail-card" style="background:#fffcf2; border-color:#fae8ff;">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:2rem; margin-bottom:1.5rem;">
                                <div>
                                    <p style="font-size:0.7rem; font-weight:700; color:#b45309;">REASON</p>
                                    <p style="font-weight:800; color:#92400e;" th:text="${escalation.reason}"></p>
                                </div>
                                <div>
                                    <p style="font-size:0.7rem; font-weight:700; color:#b45309;">SEVERITY</p>
                                    <span class="badge" th:style="'background:' + (${escalation.severity == 'CRITICAL' ? '#7f1d1d; color:white;' : (escalation.severity == 'HIGH' ? '#fca5a5; color:#7f1d1d;' : '#fef3c7; color:#92400e;')})" th:text="${escalation.severity}"></span>
                                </div>
                            </div>
                            <p style="font-size:0.7rem; font-weight:700; color:#b45309; margin-bottom:0.5rem;">STAFF COMMENT</p>
                            <p th:text="${escalation.comment}" style="color:#78350f; font-style:italic;"></p>
                        </div>
                    </div>
                </div>

                <div class="action-column">
                    <div class="action-panel shadow-lg">
                        <h2 style="font-size:1.1rem; font-weight:800; margin-bottom:1.5rem; display:flex; align-items:center; gap:8px;">
                            <i class="fa-solid fa-screwdriver-wrench" style="color:var(--primary);"></i> Management Widget
                        </h2>

                        <!-- Action Form -->
                        <div style="display:grid; gap:0.75rem; margin-bottom:2rem;">
                            <!-- In Review Button -->
                            <form th:if="${escalation.status == 'OPEN'}" th:action="@{/admin/sla/review/{id}(id=${escalation.id})}" method="POST">
                                <button type="submit" class="btn btn-outline" style="width:100%; justify-content:center; border-color:#f59e0b; color:#9a3412;">
                                    <i class="fa-solid fa-eye"></i> Mark Under Review
                                </button>
                            </form>
                            
                            <!-- Approve Button -->
                            <form th:if="${escalation.status == 'OPEN' || escalation.status == 'IN_REVIEW'}" th:action="@{/admin/sla/approve/{id}(id=${escalation.id})}" method="POST">
                                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; background:#7c3aed;">
                                    <i class="fa-solid fa-check-circle"></i> Approve Escalation
                                </button>
                            </form>
 
                            <!-- Resolve Button -->
                            <form th:if="${escalation.status == 'APPROVED'}" th:action="@{/admin/sla/resolve/{id}(id=${escalation.id})}" method="POST">
                                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; background:#10b981;">
                                    <i class="fa-solid fa-flag-checkered"></i> Resolve & Close
                                </button>
                            </form>
 
                            <!-- Reject Area -->
                            <div th:if="${escalation.status == 'OPEN' || escalation.status == 'IN_REVIEW'}">
                                <form th:action="@{/admin/sla/reject/{id}(id=${escalation.id})}" method="POST">
                                    <textarea name="adminComment" required placeholder="Reason for rejection..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #fca5a5; font-size:0.85rem; margin-bottom:5px;"></textarea>
                                    <button type="submit" class="btn btn-outline" style="width:100%; justify-content:center; color:#991b1b; border-color:#fca5a5;">
                                        <i class="fa-solid fa-xmark-circle"></i> Reject Escalation
                                    </button>
                                </form>
                            </div>
                        </div>
 
                        <hr style="border:0; border-top:1px solid var(--border-color); margin:1.5rem 0;">
 
                        <!-- Assignment Area -->
                        <form th:action="@{/admin/sla/assign/{id}(id=${escalation.id})}" method="POST">
                            <label class="detail-label">Assign to specialized staff</label>
                            <div style="display:flex; gap:0.5rem;">
                                <select name="staffId" class="input-field" style="padding:0.5rem; flex:1;">
                                    <option th:each="s : ${staffMembers}" th:value="${s.id}" th:text="${s.name}" th:selected="${escalation.assignedTo != null && s.id == escalation.assignedTo.id}"></option>
                                </select>
                                <button type="submit" class="btn btn-secondary btn-sm" style="padding:0 12px;">Assign</button>
                            </div>
                        </form>
 
                        <!-- Admin Note Area -->
                        <form th:action="@{/admin/sla/comment/{id}(id=${escalation.id})}" method="POST" style="margin-top:1.5rem;">
                            <label class="detail-label">Permanent Admin Comment</label>
                            <textarea name="adminComment" placeholder="Add a public instruction or note..." th:text="${escalation.adminComment}" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); font-size:0.85rem;"></textarea>
                            <button type="submit" class="btn btn-outline btn-sm" style="width:100%; margin-top:0.5rem;">Save Instruction</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
