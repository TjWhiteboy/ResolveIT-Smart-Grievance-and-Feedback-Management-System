<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Admin Notifications')}">
</head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <div class="app-container">
        <!-- Admin Sidebar -->
        <div th:replace="~{fragments/sidebar :: sidebar('notifications')}"></div>

        <main class="main-content">
            <!-- CSRF for JS API calls -->
            <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
            <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>

            <style>
                .notifications-wrap {
                    max-width: 1000px;
                    margin: 0 auto;
                }

                .notif-page-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 2rem;
                    flex-wrap: wrap;
                    gap: 1rem;
                }

                .notif-page-header h1 {
                    font-size: 2rem;
                    font-weight: 800;
                    color: var(--text-main);
                    letter-spacing: -0.03em;
                    margin: 0;
                }

                .notif-page-header p {
                    color: var(--text-muted);
                    font-size: 0.95rem;
                    margin: 0.35rem 0 0;
                }

                .notif-filter-bar {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 1.5rem;
                    border-bottom: 1px solid var(--border-color);
                    padding-bottom: 0.75rem;
                }

                .notif-tabs {
                    display: flex;
                    gap: 0.5rem;
                }

                .notif-tab {
                    padding: 0.6rem 1.25rem;
                    background: none;
                    border: none;
                    font-weight: 700;
                    font-size: 0.95rem;
                    color: var(--text-muted);
                    cursor: pointer;
                    border-radius: 10px;
                    transition: all 0.2s;
                    display: flex;
                    align-items: center;
                    gap: 0.5rem;
                }

                .notif-tab:hover {
                    background: #f1f5f9;
                    color: var(--text-main);
                }

                .notif-tab.active {
                    background: var(--primary);
                    color: #fff;
                    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
                }

                .notif-tab .count-badge {
                    font-size: 0.8rem;
                    background: rgba(255,255,255,0.2);
                    padding: 2px 8px;
                    border-radius: 99px;
                }

                .notif-tab:not(.active) .count-badge {
                    background: rgba(0,0,0,0.06);
                }

                .notif-list {
                    display: flex;
                    flex-direction: column;
                    gap: 1rem;
                }

                .notif-card {
                    background: #fff;
                    border: 1px solid var(--border-color);
                    border-radius: 16px;
                    padding: 1.4rem 1.5rem;
                    display: flex;
                    gap: 1.25rem;
                    position: relative;
                    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
                    animation: notifFadeIn 0.3s ease-out;
                }

                @keyframes notifFadeIn {
                    from { opacity: 0; transform: translateY(12px); }
                    to   { opacity: 1; transform: translateY(0); }
                }

                .notif-card:hover {
                    border-color: var(--primary);
                    box-shadow: 0 8px 24px -4px rgba(37,99,235,0.1);
                    transform: translateY(-2px);
                }

                .notif-card.unread {
                    border-left: 5px solid var(--primary);
                    background: linear-gradient(135deg, rgba(37,99,235,0.03), #fff);
                }

                .notif-icon-box {
                    width: 52px;
                    height: 52px;
                    border-radius: 14px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 1.35rem;
                    flex-shrink: 0;
                }

                .notif-body {
                    flex: 1;
                    min-width: 0;
                }

                .notif-title-row {
                    display: flex;
                    justify-content: space-between;
                    align-items: flex-start;
                    margin-bottom: 0.4rem;
                    gap: 1rem;
                }

                .notif-title {
                    font-weight: 800;
                    font-size: 1.05rem;
                    color: var(--text-main);
                    display: flex;
                    align-items: center;
                    gap: 0.6rem;
                    flex-wrap: wrap;
                }

                .unread-dot {
                    width: 9px;
                    height: 9px;
                    background: var(--primary);
                    border-radius: 50%;
                    display: inline-block;
                    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
                    flex-shrink: 0;
                }

                .type-badge {
                    font-size: 0.68rem;
                    font-weight: 700;
                    text-transform: uppercase;
                    letter-spacing: 0.06em;
                    padding: 3px 9px;
                    border-radius: 6px;
                }

                .notif-text {
                    color: var(--secondary, #64748b);
                    font-size: 0.95rem;
                    line-height: 1.55;
                    margin-bottom: 0.9rem;
                }

                .notif-footer {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding-top: 0.75rem;
                    border-top: 1px solid var(--border-color);
                }

                .notif-meta {
                    display: flex;
                    align-items: center;
                    gap: 1rem;
                    font-size: 0.82rem;
                    color: var(--text-muted);
                }

                .notif-actions {
                    display: flex;
                    gap: 0.75rem;
                }

                .notif-btn {
                    font-size: 0.85rem;
                    font-weight: 600;
                    color: var(--primary);
                    text-decoration: none;
                    padding: 0.45rem 1rem;
                    border-radius: 8px;
                    border: none;
                    background: #eff6ff;
                    cursor: pointer;
                    transition: all 0.2s;
                }

                .notif-btn:hover {
                    background: var(--primary);
                    color: #fff;
                }

                .notif-btn-danger {
                    color: #ef4444;
                    background: none;
                    border: none;
                    cursor: pointer;
                    font-size: 1rem;
                    padding: 0.45rem 0.6rem;
                    border-radius: 8px;
                    opacity: 0.4;
                    transition: all 0.2s;
                }

                .notif-btn-danger:hover {
                    background: #fee2e2;
                    opacity: 1;
                }

                .empty-center {
                    text-align: center;
                    padding: 5rem 2rem;
                    background: #fff;
                    border: 2px dashed var(--border-color);
                    border-radius: 24px;
                }

                .empty-icon {
                    font-size: 4.5rem;
                    color: #cbd5e1;
                    margin-bottom: 1.5rem;
                }

                .header-actions {
                    display: flex;
                    gap: 0.75rem;
                    flex-wrap: wrap;
                }
            </style>

            <div class="notifications-wrap">
                <!-- Page Header -->
                <div class="notif-page-header">
                    <div>
                        <h1><i class="fa-solid fa-bell" style="color: var(--primary); margin-right: 0.5rem;"></i>Notifications</h1>
                        <p>Stay updated with alerts, complaint changes, escalations, and system messages.</p>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-secondary" onclick="markAllNotificationsAsRead()" style="border-radius: 10px;">
                            <i class="fa-solid fa-check-double"></i> Mark All as Read
                        </button>
                        <button class="btn btn-outline" onclick="loadNotifications()" style="border-radius: 10px;">
                            <i class="fa-solid fa-rotate"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Filter Tabs -->
                <div class="notif-filter-bar">
                    <div class="notif-tabs">
                        <button class="notif-tab active" data-filter="all" onclick="setFilter('all')" id="tab-all">
                            All <span class="count-badge" id="count-all">0</span>
                        </button>
                        <button class="notif-tab" data-filter="unread" onclick="setFilter('unread')" id="tab-unread">
                            Unread <span class="count-badge" id="count-unread">0</span>
                        </button>
                        <button class="notif-tab" data-filter="read" onclick="setFilter('read')" id="tab-read">
                            Read <span class="count-badge" id="count-read">0</span>
                        </button>
                    </div>
                </div>

                <!-- Notification List -->
                <div class="notif-list" id="notifications-list-root">
                    <div style="text-align: center; padding: 5rem;">
                        <div class="spinner" style="width: 44px; height: 44px; margin: 0 auto 1.5rem;"></div>
                        <p style="color: var(--text-muted); font-size: 1rem;">Fetching admin alerts...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" style="position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: #fff; padding: 1.1rem 1.75rem; border-radius: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,0.12); display: none; z-index: 9999; animation: notifFadeIn 0.3s ease-out;">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Done!</span>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>

    <script>
        let currentFilter = 'all';
        let allNotifications = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
            setInterval(loadNotifications, 30000); // auto-refresh every 30s
        });

        function getCsrf() {
            const token  = document.querySelector('meta[name="_csrf"]')?.content || '';
            const header = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
            return { token, header };
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.notif-tab').forEach(t =>
                t.classList.toggle('active', t.dataset.filter === filter));
            renderNotifications();
        }

        async function loadNotifications() {
            const root = document.getElementById('notifications-list-root');
            try {
                const res = await fetch('/api/notifications');
                if (!res.ok) throw new Error('API ' + res.status);
                allNotifications = await res.json();
                allNotifications.forEach(n => { if (n.read === undefined) n.read = n.isRead; });

                const total   = allNotifications.length;
                const unread  = allNotifications.filter(n => !n.read).length;
                const read    = allNotifications.filter(n => n.read).length;

                document.getElementById('count-all').innerText    = total;
                document.getElementById('count-unread').innerText = unread;
                document.getElementById('count-read').innerText   = read;

                renderNotifications();
                if (window.fetchUnreadCount) window.fetchUnreadCount();

            } catch (err) {
                console.error('Notification load failed:', err);
                root.innerHTML = `
                    <div class="empty-center">
                        <div class="empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                        <h3>Connection Error</h3>
                        <p>Unable to load notifications. Please refresh.</p>
                        <button class="btn btn-primary" onclick="loadNotifications()" style="margin-top:1rem;">Retry</button>
                    </div>`;
            }
        }

        function renderNotifications() {
            const root = document.getElementById('notifications-list-root');
            let filtered = allNotifications;
            if (currentFilter === 'unread') filtered = allNotifications.filter(n => !n.read);
            if (currentFilter === 'read')   filtered = allNotifications.filter(n =>  n.read);

            if (filtered.length === 0) {
                const msgs = {
                    all:    { icon: 'fa-shield-check', title: 'System Secure', body: 'All clear! No pending alerts or escalations.' },
                    unread: { icon: 'fa-bell-slash',   title: 'All Read',      body: 'You have read all your notifications.' },
                    read:   { icon: 'fa-inbox',        title: 'No Read Items', body: 'No read notifications yet.' }
                };
                const m = msgs[currentFilter];
                root.innerHTML = `
                    <div class="empty-center">
                        <div class="empty-icon"><i class="fa-solid ${m.icon}"></i></div>
                        <h3>${m.title}</h3>
                        <p>${m.body}</p>
                    </div>`;
                return;
            }

            root.innerHTML = filtered.map(n => `
                <div class="notif-card ${n.read ? '' : 'unread'}" id="notif-${n.id}">
                    <div class="notif-icon-box" style="color:${typeColor(n.type)}; background:${typeColor(n.type)}18;">
                        <i class="${typeIcon(n.type)}"></i>
                    </div>
                    <div class="notif-body">
                        <div class="notif-title-row">
                            <div class="notif-title">
                                ${!n.read ? '<span class="unread-dot"></span>' : ''}
                                ${n.title || 'System Alert'}
                                <span class="type-badge" style="background:${typeColor(n.type)}18; color:${typeColor(n.type)};">${n.type || 'SYSTEM'}</span>
                            </div>
                            <button class="notif-btn-danger" onclick="deleteNotification(${n.id})" title="Delete">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <div class="notif-text">${n.message || ''}</div>
                        <div class="notif-footer">
                            <div class="notif-meta">
                                <span><i class="fa-regular fa-clock"></i> ${timeAgo(n.createdAt)}</span>
                                ${n.complaintId ? `<span><i class="fa-solid fa-hashtag"></i> COMP-${n.complaintId}</span>` : ''}
                            </div>
                            <div class="notif-actions">
                                ${!n.read ? `<button class="notif-btn" onclick="markRead(${n.id})">Acknowledge</button>` : ''}
                                ${n.targetUrl ? `<a href="${n.targetUrl}" class="notif-btn">Investigate →</a>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function markRead(id) {
            const { token, header } = getCsrf();
            try {
                await fetch(`/api/notifications/${id}/read`, { method: 'POST', headers: { [header]: token } });
                const n = allNotifications.find(n => n.id === id);
                if (n) n.read = true;
                renderNotifications();
                updateCounts();
                if (window.fetchUnreadCount) window.fetchUnreadCount();
            } catch (e) { console.error(e); }
        }

        async function markAllNotificationsAsRead() {
            const { token, header } = getCsrf();
            try {
                await fetch('/api/notifications/read-all', { method: 'POST', headers: { [header]: token } });
                allNotifications.forEach(n => n.read = true);
                renderNotifications();
                updateCounts();
                showToast('All alerts acknowledged');
                if (window.fetchUnreadCount) window.fetchUnreadCount();
            } catch (e) { console.error(e); }
        }

        async function deleteNotification(id) {
            if (!confirm('Delete this notification?')) return;
            const { token, header } = getCsrf();
            try {
                const res = await fetch(`/api/notifications/${id}`, { method: 'DELETE', headers: { [header]: token } });
                if (res.ok) {
                    allNotifications = allNotifications.filter(n => n.id !== id);
                    renderNotifications();
                    updateCounts();
                    showToast('Notification deleted');
                }
            } catch (e) { console.error(e); }
        }

        function updateCounts() {
            document.getElementById('count-all').innerText    = allNotifications.length;
            document.getElementById('count-unread').innerText = allNotifications.filter(n => !n.read).length;
            document.getElementById('count-read').innerText   = allNotifications.filter(n => n.read).length;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function typeIcon(type) {
            const map = {
                ESCALATION:    'fa-solid fa-triangle-exclamation',
                NEW_COMPLAINT: 'fa-solid fa-file-circle-plus',
                SYSTEM:        'fa-solid fa-gear',
                SLA_BREACH:    'fa-solid fa-clock-rotate-left',
                SLA_ALERT:     'fa-solid fa-clock',
                ASSIGNMENT:    'fa-solid fa-user-plus',
                STATUS_UPDATE: 'fa-solid fa-arrows-rotate',
                SUCCESS:       'fa-solid fa-circle-check',
                WARNING:       'fa-solid fa-triangle-exclamation',
                INFO:          'fa-solid fa-circle-info',
                UPDATE:        'fa-solid fa-arrows-rotate',
                FEEDBACK:      'fa-solid fa-star',
                MESSAGE:       'fa-solid fa-envelope',
            };
            return map[type] || 'fa-solid fa-bell';
        }

        function typeColor(type) {
            const map = {
                ESCALATION:    '#ef4444',
                NEW_COMPLAINT: '#3b82f6',
                SYSTEM:        '#64748b',
                SLA_BREACH:    '#f59e0b',
                SLA_ALERT:     '#f59e0b',
                ASSIGNMENT:    '#2563eb',
                STATUS_UPDATE: '#8b5cf6',
                SUCCESS:       '#10b981',
                WARNING:       '#ef4444',
                INFO:          '#3b82f6',
                UPDATE:        '#8b5cf6',
                FEEDBACK:      '#f59e0b',
                MESSAGE:       '#0ea5e9',
            };
            return map[type] || '#2563eb';
        }

        function timeAgo(dateStr) {
            if (!dateStr) return 'Unknown';
            const date = new Date(dateStr);
            const secs = Math.floor((new Date() - date) / 1000);
            if (secs < 60)   return 'Just now';
            if (secs < 3600) return Math.floor(secs/60) + 'm ago';
            if (secs < 86400)return Math.floor(secs/3600) + 'h ago';
            if (secs < 604800) return Math.floor(secs/86400) + 'd ago';
            return date.toLocaleDateString();
        }
    </script>
</body>
</html>
