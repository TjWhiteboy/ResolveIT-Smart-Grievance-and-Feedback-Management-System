<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="sidebar(activePage)" class="sidebar">
        <!-- Main Navigation -->
        <div class="admin-nav-group">
            <p class="admin-nav-label">Overview</p>
            <a th:href="@{/admin}" class="admin-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>
            <a th:href="@{/admin/complaints}" class="admin-link" th:classappend="${activePage == 'complaints'} ? 'active'">
                <i class="fa-solid fa-list-check"></i> Complaints
            </a>
            <a th:href="@{/admin/sla}" class="admin-link" th:classappend="${activePage == 'sla'} ? 'active'">
                <i class="fa-solid fa-triangle-exclamation"></i> Escalation Monitor
            </a>
        </div>

        <div class="admin-nav-group">
            <p class="admin-nav-label">Management</p>
            <a th:href="@{/admin/users}" class="admin-link" th:classappend="${activePage == 'users'} ? 'active'">
                <i class="fa-solid fa-users"></i> Users
            </a>
            <a th:href="@{/admin/staff}" class="admin-link" th:classappend="${activePage == 'staff'} ? 'active'">
                <i class="fa-solid fa-user-tie"></i> Staff
            </a>
            <a th:href="@{/admin/attendance}" class="admin-link" th:classappend="${activePage == 'attendance'} ? 'active'">
                <i class="fa-solid fa-calendar-check"></i> Attendance
            </a>
            <a th:href="@{/admin/feedback}" class="admin-link" th:classappend="${activePage == 'feedback'} ? 'active'">
                <i class="fa-solid fa-comments"></i> Feedback
            </a>
        </div>

        <div class="admin-nav-group">
            <p class="admin-nav-label">System</p>
            <a th:href="@{/admin/reports}" class="admin-link" th:classappend="${activePage == 'reports'} ? 'active'">
                <i class="fa-solid fa-file-export"></i> Reports
            </a>
            <a th:href="@{/admin/notifications}" class="admin-link" th:classappend="${activePage == 'notifications'} ? 'active'">
                <i class="fa-solid fa-bell"></i> Notifications
            </a>
            <a th:href="@{/admin/messages}" class="admin-link" th:classappend="${activePage == 'messages'} ? 'active'">
                <i class="fa-solid fa-envelope"></i> User Messages
            </a>
        </div>



        <div class="sidebar-footer">

           <div class="profile-card">
              <img th:src="${user != null && user.profilePicturePath != null ? user.profilePicturePath : '/images/admin-avatar.png'}" onerror="this.src='https://ui-avatars.com/api/?name=Admin&background=random'" class="footer-avatar">

              <div class="profile-meta">
                 <strong th:text="${userName}">Admin 1</strong>
                 <small>ADMIN</small>
              </div>

              <i class="fas fa-cog"></i>
           </div>

           <div class="system-box">
              <span class="dot"></span>
              System Operational
           </div>

        </div>
    </aside>
</body>
</html>
