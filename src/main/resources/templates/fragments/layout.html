<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ══ HEAD FRAGMENT ══ -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' – ResolveIT'">ResolveIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>



    <!-- ══ SIDEBAR FRAGMENT ══ -->
    <aside th:fragment="sidebar(activePage, role)">
        <div class="sidebar">
            <div style="margin-bottom: 2rem;">
                <p
                    style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 0 1rem; margin-bottom: 0.75rem;">
                    Menu</p>

                <!-- Admin Links -->
                <div th:if="${role == 'ADMIN'}">
                    <a th:href="@{/admin#complaints}" class="sidebar-link"
                        th:classappend="${activePage == 'complaints'} ? 'active'">
                        <i class="fa-solid fa-list-check"></i> Complaints
                    </a>
                    <a th:href="@{/admin#users}" class="sidebar-link"
                        th:classappend="${activePage == 'users'} ? 'active'">
                        <i class="fa-solid fa-users"></i> Users & Staff
                    </a>
                    <a th:href="@{/admin#performance}" class="sidebar-link"
                        th:classappend="${activePage == 'performance'} ? 'active'">
                        <i class="fa-solid fa-chart-line"></i> Performance
                    </a>
                </div>

                <!-- Staff Links -->
                <div th:if="${role == 'STAFF'}">
                    <a th:href="@{/staff/dashboard}" class="sidebar-link"
                        th:classappend="${activePage == 'dashboard'} ? 'active'">
                        <i class="fa-solid fa-house"></i> My Dashboard
                    </a>
                </div>

                <!-- User Links -->
                <div th:if="${role == 'USER'}">
                    <a th:href="@{/my-complaints}" class="sidebar-link"
                        th:classappend="${activePage == 'my-complaints'} ? 'active'">
                        <i class="fa-solid fa-folder-open"></i> My Complaints
                    </a>
                    <a th:href="@{/complaint}" class="sidebar-link"
                        th:classappend="${activePage == 'complaint'} ? 'active'">
                        <i class="fa-solid fa-plus"></i> New Complaint
                    </a>
                </div>
            </div>

            <div style="margin-top: auto; padding: 1rem;">
                <div
                    style="background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
                    <p style="font-size: 0.7rem; color: var(--text-muted); font-weight: 600;">System Status</p>
                    <p
                        style="font-size: 0.8rem; color: var(--success); font-weight: 700; display: flex; align-items: center; gap: 4px;">
                        <span style="width: 8px; height: 8px; background: var(--success); border-radius: 50%;"></span>
                        Operational
                    </p>
                </div>
            </div>
        </div>
    </aside>

    <!-- ══ FOOTER FRAGMENT ══ -->
    <footer th:fragment="footer"
        style="padding: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid var(--border-color); background: #fff;">
        <p>&copy; 2026 ResolveIT. All rights reserved.</p>
        <script th:src="@{/js/common.js}"></script>
    </footer>

</body>

</html>
