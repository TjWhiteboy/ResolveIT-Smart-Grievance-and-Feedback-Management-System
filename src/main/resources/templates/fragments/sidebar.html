<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <aside th:fragment="sidebar(activePage)" class="admin-sidebar" th:with="role=${user != null ? #strings.toUpperCase(user.role) : 'USER'}">
        <!-- Brand / Search (Optional) -->
        <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); margin-bottom: 1rem;">
            <p style="font-weight: 800; color: var(--primary); font-size: 1.25rem;">ResolveIT</p>
            <p style="font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase;" th:text="${role} + ' Portal'">Admin Portal</p>
        </div>

        <!-- Role-Based Navigation -->
        <div class="admin-nav-group">
            <p class="admin-nav-label">Overview</p>
            
            <!-- Admin Dashboard -->
            <a th:if="${role == 'ADMIN'}" th:href="@{/admin}" class="admin-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>

            <!-- Staff Dashboard -->
            <a th:if="${role == 'STAFF'}" th:href="@{/staff/dashboard}" class="admin-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
                <i class="fa-solid fa-gauge-high"></i> My Dashboard
            </a>

            <!-- User Dashboard / Complaints -->
            <a th:if="${role == 'USER'}" th:href="@{/my-complaints}" class="admin-link" th:classappend="${activePage == 'my-complaints'} ? 'active'">
                <i class="fa-solid fa-folder-open"></i> My Complaints
            </a>
            <a th:if="${role == 'USER'}" th:href="@{/complaint}" class="admin-link" th:classappend="${activePage == 'complaint'} ? 'active'">
                <i class="fa-solid fa-plus-circle"></i> New Complaint
            </a>

            <!-- Common Complaints Link for Admin/Staff -->
            <a th:if="${role == 'ADMIN' or role == 'STAFF'}" th:href="@{/admin/complaints}" class="admin-link" th:classappend="${activePage == 'complaints'} ? 'active'">
                <i class="fa-solid fa-list-check"></i> 
                <span th:text="${role == 'ADMIN' ? 'All Complaints' : 'Assigned Cases'}">Complaints</span>
            </a>
            <a th:if="${role == 'ADMIN'}" th:href="@{/admin/sla}" class="admin-link" th:classappend="${activePage == 'sla'} ? 'active'">
                <i class="fa-solid fa-triangle-exclamation"></i> Escalation Monitor
            </a>
            <a th:if="${role == 'STAFF'}" th:href="@{/staff/sla}" class="admin-link" th:classappend="${activePage == 'sla'} ? 'active'">
                <i class="fa-solid fa-stopwatch"></i> Escalation Monitor
            </a>
        </div>

        <!-- Management Section (Admin Only) -->
        <div th:if="${role == 'ADMIN'}" class="admin-nav-group">
            <p class="admin-nav-label">Management</p>
            <a th:href="@{/admin/users}" class="admin-link" th:classappend="${activePage == 'users'} ? 'active'">
                <i class="fa-solid fa-users"></i> Users
            </a>
            <a th:href="@{/admin/staff}" class="admin-link" th:classappend="${activePage == 'staff'} ? 'active'">
                <i class="fa-solid fa-user-tie"></i> Staff
            </a>
            <a th:href="@{/admin/attendance}" class="admin-link" th:classappend="${activePage == 'attendance'} ? 'active'">
                <i class="fa-solid fa-calendar-check"></i> Attendance
            </a>
            <a th:href="@{/admin/feedback}" class="admin-link" th:classappend="${activePage == 'feedback'} ? 'active'">
                <i class="fa-solid fa-comments"></i> Feedback
            </a>
        </div>

        <!-- System Section (Common) -->
        <div class="admin-nav-group">
            <p class="admin-nav-label">System</p>
            <a th:if="${role == 'ADMIN'}" th:href="@{/admin/reports}" class="admin-link" th:classappend="${activePage == 'reports'} ? 'active'">
                <i class="fa-solid fa-file-export"></i> Reports
            </a>
            <a th:href="${role == 'ADMIN'} ? @{/admin/notifications} : (${role == 'STAFF'} ? @{/staff/notifications} : @{/user/notifications})" class="admin-link" th:classappend="${activePage == 'notifications'} ? 'active'">
                <i class="fa-solid fa-bell"></i> Notifications
            </a>
            <a th:if="${role == 'ADMIN'}" th:href="@{/admin/messages}" class="admin-link" th:classappend="${activePage == 'messages'} ? 'active'">
                <i class="fa-solid fa-envelope"></i> User Messages
            </a>
        </div>

        <!-- Sidebar Footer Profile Card -->
        <div class="sidebar-footer">
            <div th:if="${activePage != 'profile'}" class="user-sidebar-card">
                <div class="user-avatar-small">
                    <img th:if="${user != null and user.profilePicturePath != null}" th:src="${user.profilePicturePath}" alt="PFP">
                    <span th:unless="${user != null and user.profilePicturePath != null}" th:text="${userName != null ? #strings.substring(userName,0,1) : 'A'}">A</span>
                </div>
                <div class="user-details">
                    <p class="user-name" th:text="${userName}">Admin Name</p>
                    <p class="user-role" th:text="${role}">ADMIN</p>
                </div>
                <!-- Link profile card to admin profile -->
                <a th:href="@{/admin/profile}" class="user-settings-btn" title="My Profile">
                    <i class="fa-solid fa-cog"></i>
                </a>
            </div>

            <div class="status-card">
                <div class="status-dot"></div>
                <span>System Operational</span>
            </div>
        </div>
    </aside>
</body>
</html>
