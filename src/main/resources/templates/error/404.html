<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Page Not Found - ResolveIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; }
        h1 { font-size: 5rem; margin: 0; color: #6366f1; }
        p { color: #64748b; margin: 1rem 0 2rem; }
        .btn { background: #6366f1; color: #fff; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 6px; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2 th:text="${status != null ? status : '404'}">404</h2>
        <p th:text="${error != null ? error : 'The page you requested was not found.'}">Page not found</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
