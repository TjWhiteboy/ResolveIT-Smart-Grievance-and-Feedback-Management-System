<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success – ResolveIt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 50% 40%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
            animation: bgShift 12s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgShift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-2%, 2%);
            }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 18s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.18);
            top: 20%;
            left: 30%;
        }

        .orb-2 {
            width: 200px;
            height: 200px;
            background: rgba(99, 102, 241, 0.1);
            bottom: 25%;
            right: 20%;
            animation-delay: -9s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-25px) scale(1.04);
            }
        }

        .card {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 420px;
            margin: 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Success checkmark animation */
        .check-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            border: 2px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .check-icon {
            width: 36px;
            height: 36px;
            position: relative;
        }

        .check-icon::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 18px;
            width: 12px;
            height: 3px;
            background: #34d399;
            border-radius: 2px;
            transform: rotate(45deg);
            animation: checkDraw1 0.3s ease-out 0.5s both;
        }

        .check-icon::after {
            content: '';
            position: absolute;
            left: 13px;
            top: 14px;
            width: 22px;
            height: 3px;
            background: #34d399;
            border-radius: 2px;
            transform: rotate(-45deg);
            animation: checkDraw2 0.3s ease-out 0.65s both;
        }

        @keyframes checkDraw1 {
            from {
                transform: rotate(45deg) scaleX(0);
            }

            to {
                transform: rotate(45deg) scaleX(1);
            }
        }

        @keyframes checkDraw2 {
            from {
                transform: rotate(-45deg) scaleX(0);
            }

            to {
                transform: rotate(-45deg) scaleX(1);
            }
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
        }

        .desc {
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.55;
            margin-bottom: 2rem;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 2rem;
            text-align: left;
        }

        .timeline-item {
            display: flex;
            gap: 1rem;
            padding: 0.6rem 0;
        }

        .timeline-dot-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .timeline-dot.future {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .timeline-line {
            width: 2px;
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
        }

        .timeline-text {
            font-size: 0.82rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .timeline-text.done {
            color: #6ee7b7;
        }

        .actions {
            display: flex;
            gap: 0.65rem;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        /* Confetti particles */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            z-index: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-100vh) rotate(0deg);
            }

            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="card">
        <div class="check-circle">
            <div class="check-icon"></div>
        </div>

        <h1>Submitted Successfully!</h1>
        <p class="desc">Your complaint has been logged and will be reviewed by our team within 24 hours.</p>

        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-dot-col">
                    <div class="timeline-dot"></div>
                    <div class="timeline-line"></div>
                </div>
                <span class="timeline-text done">✓ Complaint submitted</span>
            </div>
            <div class="timeline-item">
                <div class="timeline-dot-col">
                    <div class="timeline-dot future"></div>
                    <div class="timeline-line"></div>
                </div>
                <span class="timeline-text">Under review by team</span>
            </div>
            <div class="timeline-item">
                <div class="timeline-dot-col">
                    <div class="timeline-dot future"></div>
                </div>
                <span class="timeline-text">Resolution & notification</span>
            </div>
        </div>

        <div class="actions">
            <a href="/home.html" class="btn btn-secondary">← Home</a>
            <a id="trackLink" href="/login" class="btn btn-primary">Track Status →</a>
        </div>
    </div>

    <script>
        // Update Track Status link with userId if present
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('userId');
        if (userId) {
            document.getElementById('trackLink').href = '/my-complaints?userId=' + userId;
        }

        // Confetti burst on load
        const colors = ['#6366f1', '#38bdf8', '#10b981', '#f59e0b', '#a78bfa', '#f472b6'];
        for (let i = 0; i < 30; i++) {
            const el = document.createElement('div');
            el.classList.add('confetti');
            el.style.left = Math.random() * 100 + '%';
            el.style.background = colors[Math.floor(Math.random() * colors.length)];
            el.style.animationDuration = (2 + Math.random() * 3) + 's';
            el.style.animationDelay = (Math.random() * 1.5) + 's';
            el.style.width = (4 + Math.random() * 6) + 'px';
            el.style.height = (4 + Math.random() * 6) + 'px';
            document.body.appendChild(el);
        }
    </script>
</body>

</html>
