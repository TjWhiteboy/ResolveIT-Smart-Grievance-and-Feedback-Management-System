<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Complaints – ResolveIT Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/staff.css}">
</head>

<body data-theme="light">
    <div class="app-wrapper">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div style="display:flex;">
            <div th:replace="~{fragments/sidebar-staff :: sidebar('complaints')}"></div>
            <main class="main-container animate-fade">
                <!-- Hero Section -->
                <div class="staff-hero">
                    <div class="hero-content">
                        <h1>All Complaints</h1>
                        <p>Comprehensive repository of all platform complaints. (Read-only Access)</p>
                    </div>
                    <div class="hero-actions">
                        <div class="s-card"
                            style="padding: 0.75rem 1.25rem; background: rgba(255,255,255,0.1); border: none; backdrop-filter: blur(10px);">
                            <div style="display: flex; align-items: center; gap: 0.75rem;">
                                <div class="icon-box"
                                    style="width: 36px; height: 36px; background: rgba(255,255,255,0.2); color: #fff; font-size: 1rem;">
                                    <i class="fa-solid fa-database"></i>
                                </div>
                                <div>
                                    <h4 style="font-size: 1.1rem; font-weight: 800; line-height: 1;"
                                        th:text="${totalComplaints}">0</h4>
                                    <p
                                        style="font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.7); margin-top: 2px;">
                                        Total Entries</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Bar -->
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="complaintSearch" placeholder="Search by ID, User, or Title...">
                    </div>
                    <div style="display: flex; gap: 0.75rem;">
                        <button class="btn btn-secondary" onclick="window.print()"><i class="fa-solid fa-print"></i>
                            Export</button>
                    </div>
                </div>

                <!-- Complaints Table Card -->
                <div class="card" style="border-radius: 16px;">
                    <div class="card-header">
                        <h3 style="font-size: 1rem; font-weight: 700;">Complaint Database</h3>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="complaint-table" id="complaintTable">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>User</th>
                                    <th>Complaint Title</th>
                                    <th>Category</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${complaints}">
                                    <td th:text="${c.id}" style="font-weight: 700; color: var(--text-muted);">1</td>
                                    <td>
                                        <div class="user-cell">
                                            <div class="user-avatar-sm" th:text="${#strings.substring(c.userName,0,1)}">
                                                U</div>
                                            <span style="font-weight:600;" th:text="${c.userName}">User</span>
                                        </div>
                                    </td>
                                    <td>
                                        <div style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                                            th:text="${c.title}">Title</div>
                                    </td>
                                    <td>
                                        <span style="font-size: 0.85rem; color: var(--text-muted);"
                                            th:text="${c.category}">Tech</span>
                                    </td>
                                    <td>
                                        <span class="priority-badge"
                                            th:classappend="${c.priority == 'Low'} ? 'p-low' : (${c.priority == 'Normal'} ? 'p-medium' : 'p-high')"
                                            th:text="${c.priority}">Normal</span>
                                    </td>
                                    <td>
                                        <span class="badge"
                                            th:classappend="${c.status == 'New'} ? 'badge-new' : (${c.status == 'Under Review'} ? 'badge-review' : (${c.status == 'In Progress'} ? 'badge-progress' : (${c.status == 'Resolved'} ? 'badge-resolved' : 'badge-denied')))"
                                            th:text="${c.status}">New</span>
                                    </td>
                                    <td th:text="${#temporals.format(c.createdAt, 'dd MMM yyyy')}"
                                        style="color: var(--text-muted);">Date</td>
                                    <td>
                                        <a th:href="@{/staff/complaints/{id}(id=${c.id})}"
                                            class="btn btn-secondary btn-sm"
                                            style="padding:0.4rem 0.8rem; border-radius: 8px;">
                                            <i class="fa-solid fa-eye"></i> View
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(complaints)}">
                                    <td colspan="8" style="text-align:center;padding:5rem;color:var(--text-muted);">
                                        <i class="fa-solid fa-folder-open"
                                            style="font-size: 3rem; display: block; margin-bottom: 1rem; opacity: 0.2;"></i>
                                        <p>No complaints found in the database.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    <script th:src="@{/js/staff.js}"></script>
    <script>
        document.getElementById('complaintSearch').addEventListener('keyup', function () {
            let val = this.value.toLowerCase();
            let rows = document.querySelectorAll('#complaintTable tbody tr');
            rows.forEach(row => {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(val) ? '' : 'none';
            });
        });
    </script>
</body>

</html>
