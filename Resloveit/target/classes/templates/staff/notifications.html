<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Notifications – ResolveIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <!-- CSRF Tokens (safe for STATELESS/JWT mode) -->
    <meta name="_csrf"        th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
    <style>
        .notifications-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .notif-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .notif-page-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .notif-filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .notif-tabs {
            display: flex;
            gap: 0.75rem;
        }

        .notif-tab {
            padding: 0.7rem 1.5rem;
            background: none;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .notif-tab:hover {
            background: var(--bg-body);
            color: var(--text-main);
        }

        .notif-tab.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .notif-tab .count-badge {
            font-size: 0.8rem;
            background: rgba(0,0,0,0.05);
            padding: 2px 10px;
            border-radius: 99px;
        }

        .notif-tab.active .count-badge {
            background: rgba(37, 99, 235, 0.1);
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .notif-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            position: relative;
            transition: all 0.2s ease-out;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .notif-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .notif-card.unread {
            border-left: 5px solid var(--primary);
            background: linear-gradient(to right, rgba(37, 99, 235, 0.02), var(--bg-card));
        }

        .notif-icon-wrapper {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
            background: var(--bg-body);
        }

        .notif-body {
            flex: 1;
        }

        .notif-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .notif-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            display: inline-block;
        }

        .notif-text {
            color: var(--secondary);
            font-size: 0.975rem;
            line-height: 1.55;
            margin-bottom: 1rem;
        }

        .notif-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notif-meta {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .notif-actions {
            display: flex;
            gap: 1rem;
        }

        .action-link {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .action-link:hover {
            background: var(--primary-light);
        }

        .btn-view {
            background: var(--primary);
            color: white !important;
        }

        .btn-view:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .empty-center {
            text-align: center;
            padding: 5rem 2rem;
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 24px;
        }

        .empty-icon {
            font-size: 4rem;
            color: var(--border-color);
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body th:data-theme="${user != null && user.darkMode ? 'dark' : 'light'}" th:class="${user != null && user.compactSidebar ? 'sidebar-compact' : ''}">

    <div class="app-wrapper">
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <div style="display: flex;">
            <div th:replace="~{fragments/sidebar-staff :: sidebar('notifications')}"></div>

            <main class="main-container animate-fade">
                <div class="notifications-container">
                    
                    <div class="notif-page-header">
                        <div>
                            <h1>Staff Notifications</h1>
                            <p style="color: var(--text-muted); font-size: 0.95rem;">Track assigned tasks, SLA alerts, and team updates.</p>
                        </div>
                        <div style="display: flex; gap: 0.75rem;">
                            <button class="btn btn-secondary" onclick="markAllNotificationsAsRead()">
                                <i class="fa-solid fa-check-double"></i> Mark All as Read
                            </button>
                            <button class="btn btn-outline" onclick="loadNotifications()">
                                <i class="fa-solid fa-arrows-rotate"></i> Refresh
                            </button>
                        </div>
                    </div>

                    <div class="notif-filter-bar">
                        <div class="notif-tabs">
                            <button class="notif-tab active" data-filter="all" onclick="setFilter('all')">
                                All <span class="count-badge" id="count-all">0</span>
                            </button>
                            <button class="notif-tab" data-filter="unread" onclick="setFilter('unread')">
                                Unread <span class="count-badge" id="count-unread">0</span>
                            </button>
                            <button class="notif-tab" data-filter="read" onclick="setFilter('read')">
                                Read
                            </button>
                        </div>
                    </div>

                    <div class="notif-list" id="notifications-list-root">
                        <div style="text-align: center; padding: 4rem;">
                            <div class="spinner" style="width: 40px; height: 40px; margin: 0 auto 1rem;"></div>
                            <p style="color: var(--text-muted);">Loading your queue...</p>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>

    <div id="toast" style="position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: #fff; padding: 1.25rem 2rem; border-radius: 14px; font-weight: 700; box-shadow: var(--shadow-lg); display: none; z-index: 1000; animation: slideUp 0.3s ease-out;">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Success!</span>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    <script>
        let currentFilter = 'all';
        let allNotifications = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
            setInterval(loadNotifications, 30000);
        });

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.notif-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.filter === filter);
            });
            renderNotifications();
        }

        async function loadNotifications() {
            try {
                const res = await fetch('/api/notifications');
                allNotifications = await res.json();
                allNotifications.forEach(n => { if (n.read === undefined) n.read = n.isRead; });
                document.getElementById('count-all').innerText = allNotifications.length;
                document.getElementById('count-unread').innerText = allNotifications.filter(n => !n.read).length;
                renderNotifications();
                if (window.fetchUnreadCount) window.fetchUnreadCount();
            } catch (err) {}
        }

        function renderNotifications() {
            const listRoot = document.getElementById('notifications-list-root');
            let filtered = allNotifications;
            if (currentFilter === 'unread') filtered = allNotifications.filter(n => !n.read);
            if (currentFilter === 'read') filtered = allNotifications.filter(n => n.read);

            if (filtered.length === 0) {
                listRoot.innerHTML = `
                    <div class="empty-center">
                        <div class="empty-icon"><i class="fa-solid fa-calendar-check"></i></div>
                        <h3>All caught up!</h3>
                        <p>No new notifications in your queue. Great job!</p>
                    </div>
                `;
                return;
            }

            listRoot.innerHTML = filtered.map(n => `
                <div class="notif-card ${n.read ? '' : 'unread'}">
                    <div class="notif-icon-wrapper" style="color: ${getNotifTypeColor(n.type)}; background: ${getNotifTypeColor(n.type)}15">
                        <i class="${getNotifTypeIcon(n.type)}"></i>
                    </div>
                    <div class="notif-body">
                        <div class="notif-title-row">
                            <div class="notif-title">
                                ${!n.read ? '<span class="unread-dot"></span>' : ''}
                                ${n.title || 'Task Update'}
                            </div>
                            <button class="delete-btn" style="opacity: 0.3; background:none; border:none; cursor:pointer;" onclick="deleteNotification(${n.id})">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                        <div class="notif-text">${n.message}</div>
                        <div class="notif-footer">
                            <div class="notif-meta">
                                <span><i class="fa-regular fa-clock"></i> ${timeAgo(n.createdAt)}</span>
                                ${n.complaintId ? `<span><i class="fa-solid fa-ticket"></i> #${n.complaintId}</span>` : ''}
                            </div>
                            <div class="notif-actions">
                                ${!n.read ? `<button class="action-link" onclick="markRead(${n.id})">Mark Read</button>` : ''}
                                ${n.targetUrl ? `<a href="${n.targetUrl}" class="action-link btn-view">Process Task</a>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function markRead(id) {
            const token = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            try {
                await fetch(`/api/notifications/${id}/read`, { 
                    method: 'POST',
                    headers: { [header]: token }
                });
                loadNotifications();
            } catch (err) {}
        }

        async function markAllNotificationsAsRead() {
            const token = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            try {
                await fetch('/api/notifications/read-all', { 
                    method: 'POST',
                    headers: { [header]: token }
                });
                showToast('Marked all as read');
                loadNotifications();
            } catch (err) {}
        }

        async function deleteNotification(id) {
            const token = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            try {
                await fetch(`/api/notifications/${id}`, { 
                    method: 'DELETE',
                    headers: { [header]: token }
                });
                loadNotifications();
            } catch (err) {}
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function getNotifTypeIcon(type) {
            switch(type) {
                case 'ASSIGNMENT': return 'fa-solid fa-user-plus';
                case 'SLA_ALERT': return 'fa-solid fa-clock';
                case 'STATUS_UPDATE': return 'fa-solid fa-sync';
                default: return 'fa-solid fa-bell';
            }
        }

        function getNotifTypeColor(type) {
            switch(type) {
                case 'ASSIGNMENT': return '#2563eb';
                case 'SLA_ALERT': return '#ef4444';
                case 'STATUS_UPDATE': return '#8b5cf6';
                default: return '#64748b';
            }
        }

        function timeAgo(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff/60) + 'm ago';
            if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
            return date.toLocaleDateString();
        }
    </script>
</body>

</html>
