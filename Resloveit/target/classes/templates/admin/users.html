<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='User Management')}"></head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('users')}"></div>
        <main class="main-content">
            <div style="margin-bottom: 2.5rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;">User Management</h1>
                    <p style="color: var(--text-muted); font-size: 1rem;">View and manage all registered platform users.</p>
                </div>
            </div>

            <div class="recent-activity">
                <div class="ra-header">
                    <h2 style="font-size: 1rem; font-weight: 700; color: var(--text-main);">Registered Users</h2>
                    <span class="badge badge-new" th:text="${#lists.size(usersList)} + ' total'"></span>
                </div>
                <table class="complaint-table">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email Address</th>
                            <th>Status</th>
                            <th>Joint Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usersList}">
                            <td th:text="'#' + ${u.id}" style="color: var(--secondary); font-weight: 700;"></td>
                            <td th:text="${u.name}" style="font-weight: 600;"></td>
                            <td th:text="${u.email}"></td>
                            <td>
                                <span th:if="${u.enabled}" class="badge badge-resolved">Active</span>
                                <span th:if="${!u.enabled}" class="badge badge-denied">Deactivated</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}"></td>
                            <td>
                                <form th:action="@{/admin/users/toggle-status}" method="post" style="display:inline;">
                                    <input type="hidden" name="userId" th:value="${u.id}">
                                    <button type="submit" class="btn btn-outline"
                                        th:text="${u.enabled ? 'Deactivate' : 'Activate'}"
                                        th:style="${u.enabled ? 'color: var(--danger);' : 'color: var(--success);'}"></button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
