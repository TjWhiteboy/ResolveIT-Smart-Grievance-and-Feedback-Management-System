<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Staff Attendance')}"></head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('attendance')}"></div>
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Attendance Logs</h1>
                <p style="color: var(--text-muted);">Track staff check-ins, check-outs, and daily operational presence.
                </p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Daily Logs</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Staff Member</th>
                            <th>Date</th>
                            <th>Check In</th>
                            <th>Check Out</th>
                            <th>Stay Duration</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${records}">
                            <td th:text="${r.userName}" style="font-weight: 600;"></td>
                            <td th:text="${r.date}"></td>
                            <td th:text="${#temporals.format(r.checkInTime, 'HH:mm')}"
                                style="font-weight: 700; color: var(--primary);"></td>
                            <td
                                th:text="${r.checkOutTime != null ? #temporals.format(r.checkOutTime, 'HH:mm') : '--:--'}">
                            </td>
                            <td th:text="${r.hoursWorked != null ? r.hoursWorked + ' hrs' : '-'}"></td>
                            <td>
                                <span class="badge"
                                    th:classappend="${r.status == 'PRESENT' ? 'badge-resolved' : 'badge-denied'}"
                                    th:text="${r.status}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
