<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='System Settings')}"></head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('settings')}"></div>
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">System Configuration</h1>
                <p style="color: var(--text-muted);">Adjust application parameters, SLA limits, and branding.</p>
            </div>

            <form th:action="@{/admin/settings/update}" method="post" class="card"
                style="max-width: 800px; padding: 2rem;">
                <div th:if="${param.success}"
                    style="background: #ecfdf5; color: #059669; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-weight: 600; font-size: 0.875rem;">
                    Settings updated successfully!
                </div>

                <div style="display: grid; gap: 2rem;">
                    <div style="display: grid; gap: 0.5rem;">
                        <label style="font-weight: 700; color: var(--text-main);">Application Name</label>
                        <input type="text" name="APP_NAME" th:value="${appName}" class="btn-outline"
                            style="padding: 0.75rem; border-radius: 8px; width: 100%; text-align: left;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">This name appears in page titles and
                            navigation.</p>
                    </div>

                    <div style="display: grid; gap: 0.5rem;">
                        <label style="font-weight: 700; color: var(--text-main);">SLA Threshold (Hours)</label>
                        <input type="number" name="SLA_HOURS" th:value="${@systemSettingService.getSlaHours()}"
                            class="btn-outline"
                            style="padding: 0.75rem; border-radius: 8px; width: 100%; text-align: left;">
                        <p style="font-size: 0.75rem; color: var(--text-muted);">Complaints unresolved after this
                            duration will be marked as "Overdue".</p>
                    </div>

                    <div style="display: flex; gap: 0.5rem; align-items: center;">
                        <input type="checkbox" name="DARK_MODE_DEFAULT" id="dm_def"
                            style="width: 1.25rem; height: 1.25rem;">
                        <label for="dm_def" style="font-weight: 600; color: var(--text-main);">Enable Dark Mode by
                            Default</label>
                    </div>

                    <div style="padding-top: 1rem; border-top: 1px solid var(--border-color);">
                        <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Save All
                            Changes</button>
                    </div>
                </div>
            </form>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
