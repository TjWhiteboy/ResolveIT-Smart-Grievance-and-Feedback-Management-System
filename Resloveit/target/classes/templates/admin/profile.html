<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Admin Profile')}"></head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="app-container">
        <aside th:replace="~{fragments/sidebar-admin :: sidebar('profile')}"></aside>
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Personal Account</h1>
                <p style="color: var(--text-muted);">Manage your administrator profile and secure your access.</p>
            </div>

            <div class="card" style="max-width: 800px;">
                <div style="background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); height: 120px;"></div>
                <div style="padding: 0 2rem 2rem;">
                    <div
                        style="margin-top: -40px; display: flex; align-items: flex-end; gap: 1.5rem; margin-bottom: 2rem;">
                        <div
                            style="width: 100px; height: 100px; border-radius: 20px; border: 4px solid #fff; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--primary); font-weight: 800;">
                            A
                        </div>
                        <div style="margin-bottom: 0.5rem;">
                            <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-main);"
                                th:text="${userName}">Admin Name</h2>
                            <p style="font-size: 0.875rem; color: var(--text-muted);">System Administrator</p>
                        </div>
                    </div>

                    <div
                        style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; border-top: 1px solid var(--border-color); padding-top: 2rem;">
                        <div>
                            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;">Profile Details</h3>
                            <div style="display: grid; gap: 1rem;">
                                <div>
                                    <p
                                        style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
                                        Email Address</p>
                                    <p style="font-weight: 600; color: var(--text-main);" th:text="${user.email}"></p>
                                </div>
                                <div>
                                    <p
                                        style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">
                                        Joined On</p>
                                    <p style="font-weight: 600; color: var(--text-main);"
                                        th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy')}"></p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem;">Quick Actions</h3>
                            <div style="display: grid; gap: 0.75rem;">
                                <a th:href="@{/admin/profile/edit}" class="btn btn-outline">Change Password</a>
                                <a th:href="@{/admin/settings}" class="btn btn-outline">System Settings</a>
                                <a th:href="@{/auth/logout}" class="btn btn-outline logout-btn-danger">Logout
                                    Account</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
