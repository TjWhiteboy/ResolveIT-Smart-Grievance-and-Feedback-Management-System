<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Manage Complaints')}">
</head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('complaints')}"></div>

        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Complaint Inventory</h1>
                <p style="color: var(--text-muted);">Manage, filter, and assign all platform grievances from one place.
                </p>
            </div>

            <!-- Filters -->
            <form th:action="@{/admin/complaints}" method="get" class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Search</label>
                    <input type="text" name="search" th:value="${keyword}" class="search-input"
                        placeholder="Ref#, Title, or User...">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Status</label>
                    <select name="status" class="filter-select" onchange="this.form.submit()">
                        <option value="">All Statuses</option>
                        <option value="New" th:selected="${selStatus == 'New'}">New</option>
                        <option value="Under Review" th:selected="${selStatus == 'Under Review'}">Under Review</option>
                        <option value="In Progress" th:selected="${selStatus == 'In Progress'}">In Progress</option>
                        <option value="Resolved" th:selected="${selStatus == 'Resolved'}">Resolved</option>
                        <option value="Denied" th:selected="${selStatus == 'Denied'}">Denied</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Urgency</label>
                    <select name="urgency" class="filter-select" onchange="this.form.submit()">
                        <option value="">All Levels</option>
                        <option value="High" th:selected="${selUrgency == 'High'}">High</option>
                        <option value="Medium" th:selected="${selUrgency == 'Medium'}">Medium</option>
                        <option value="Low" th:selected="${selUrgency == 'Low'}">Low</option>
                    </select>
                </div>
                <div style="margin-left: auto; align-self: flex-end;">
                    <a th:href="@{/admin/complaints}" class="btn btn-outline">Clear</a>
                    <button type="submit" class="btn btn-primary">Apply</button>
                </div>
            </form>

            <!-- Table -->
            <table class="complaint-table">
                <thead>
                    <tr>
                        <th>Ref#</th>
                        <th>User</th>
                        <th>Title & Category</th>
                        <th>Urgency</th>
                        <th>Status</th>
                        <th>Staff Assignee</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${complaints}">
                        <td style="font-weight: 800; color: var(--secondary);" th:text="'#' + ${c.id}"></td>
                        <td>
                            <div style="font-weight: 600;" th:text="${c.userName}">User Name</div>
                        </td>
                        <td>
                            <div style="font-weight: 700; color: var(--text-main);" th:text="${c.title}">Complaint Title
                            </div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${c.category}">Category
                            </div>
                        </td>
                        <td>
                            <span class="urgency-pill"
                                th:classappend="${c.urgency == 'High' ? 'u-high' : (c.urgency == 'Medium' ? 'u-medium' : 'u-low')}"
                                th:text="${c.urgency}">High</span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="
                                ${c.status == 'New'} ? 'badge-new' :
                                (${c.status == 'Under Review'} ? 'badge-pending' :
                                (${c.status == 'Resolved'} ? 'badge-resolved' :
                                (${c.status == 'Denied'} ? 'badge-denied' : 'badge-new')))"
                                th:text="${c.status}">New</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/complaints/assign}" method="post"
                                style="display: flex; gap: 4px;">
                                <input type="hidden" name="complaintId" th:value="${c.id}">
                                <select name="staffId"
                                    style="font-size: 0.8rem; border-radius: 4px; border: 1px solid #ddd; padding: 4px;">
                                    <option value="0">Unassigned</option>
                                    <option th:each="staff : ${staffList}" th:value="${staff.id}"
                                        th:text="${staff.name}" th:selected="${staff.id == c.assignedStaff}"></option>
                                </select>
                                <button type="submit" class="btn btn-outline"
                                    style="padding: 4px 8px; font-size: 0.75rem;">Set</button>
                            </form>
                        </td>
                        <td style="display: flex; gap: 4px; align-items: center; flex-wrap: wrap;">
                            <a th:href="@{'/admin/details/' + ${c.id}}" class="btn btn-outline"
                                style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">
                                <i class="fa-solid fa-eye"></i> View Details
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
