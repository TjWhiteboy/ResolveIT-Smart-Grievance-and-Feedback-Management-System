<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied - ResolveIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fef2f2; color: #991b1b; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 400px; border-top: 4px solid #ef4444; }
        h1 { font-size: 5rem; margin: 0; color: #ef4444; }
        p { color: #b91c1c; margin: 1rem 0 2rem; }
        .btn { background: #ef4444; color: #fff; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container">
        <h1>403</h1>
        <h2>Access Denied</h2>
        <p th:text="${error != null ? error : 'You do not have permission to view this page.'}">Forbidden</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
