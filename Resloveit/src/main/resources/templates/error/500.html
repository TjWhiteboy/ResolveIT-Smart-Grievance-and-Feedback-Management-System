<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Server Error - ResolveIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fff7ed; color: #9a3412; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; padding: 2rem; background: #fff; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 500px; border-top: 4px solid #f97316; }
        h1 { font-size: 5rem; margin: 0; color: #f97316; }
        p { color: #c2410c; margin: 1rem 0; }
        .details { font-family: monospace; font-size: 0.8rem; background: #fefce8; padding: 1rem; border-radius: 6px; text-align: left; color: #854d0e; overflow-x: auto; margin-bottom: 2rem; }
        .btn { background: #f97316; color: #fff; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 6px; font-weight: 600; }
        .btn:hover { background: #ea580c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Server Error</h2>
        <p th:text="${error}">An unexpected error occurred on our end.</p>
        <div class="details" th:if="${message}" th:text="${message}">Error details appear here...</div>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>
