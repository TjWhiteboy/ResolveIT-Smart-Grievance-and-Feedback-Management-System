<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(title='Staff Performance')}"></head>

<body class="bg-main">
    <div th:replace="~{fragments/topbar :: topbar}"></div>
    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar('staff')}"></div>
        <main class="main-content">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Staff Workforce</h1>
                <p style="color: var(--text-muted);">Monitor workload, resolution rates, and efficiency metrics.</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Performance Metrics</h2>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Staff Member</th>
                            <th>Total Tasks</th>
                            <th>Resolved</th>
                            <th>Pending</th>
                            <th>Efficiency</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${staffList}">
                            <td>
                                <div style="font-weight: 700; color: var(--text-main);" th:text="${s.name}">Staff Name
                                </div>
                            </td>
                            <td th:text="${s.total}">0</td>
                            <td th:text="${s.resolved}" style="color: var(--success); font-weight: 600;">0</td>
                            <td th:text="${s.pending}" style="color: var(--warning); font-weight: 600;">0</td>
                            <td th:text="${#numbers.formatDecimal(s.rate, 1, 1)} + '%'">0%</td>
                            <td>
                                <span th:if="${s.rate >= 80}" class="badge badge-resolved">Top Performer</span>
                                <span th:if="${s.rate < 80 and s.rate >= 50}" class="badge badge-pending">Stable</span>
                                <span th:if="${s.rate < 50}" class="badge badge-denied">Review Needed</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
</body>

</html>
