<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log – ResolveIT Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .activity-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: .75rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: box-shadow .2s;
        }

        .activity-item:hover {
            box-shadow: var(--shadow-sm);
        }

        .act-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            flex-shrink: 0;
        }

        .act-desc {
            flex: 1;
            font-size: .9rem;
            font-weight: 500;
        }

        .act-time {
            font-size: .75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .act-type {
            font-size: .65rem;
            font-weight: 700;
            padding: .15rem .5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .filter-pills {
            display: flex;
            gap: .5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-pill {
            padding: .4rem 1rem;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            transition: all .2s;
        }

        .filter-pill:hover,
        .filter-pill.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
    </style>
</head>

<body data-theme="light">
    <div class="app-wrapper">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div style="display:flex;">
            <div th:replace="~{fragments/sidebar-staff :: sidebar('activity')}"></div>
            <main class="main-container animate-fade">
                <div style="margin-bottom:2rem;">
                    <h1 style="font-size:1.875rem;font-weight:800;">Activity Log</h1>
                    <p style="color:var(--text-muted);font-size:.9rem;margin-top:.25rem;">Your actions and events across
                        the platform.</p>
                </div>
                <div class="filter-pills">
                    <span class="filter-pill active" onclick="filterAct('')">All</span>
                    <span class="filter-pill" onclick="filterAct('today')">Today</span>
                    <span class="filter-pill" onclick="filterAct('week')">This Week</span>
                    <span class="filter-pill" onclick="filterAct('month')">This Month</span>
                </div>
                <div id="actList">
                    <div th:each="a : ${activities}" class="activity-item" th:attr="data-time=${a.time}">
                        <div class="act-icon"
                            th:style="${a.type == 'CHECKIN'} ? 'background:#d1fae5;color:#065f46;' : (${a.type == 'CHECKOUT'} ? 'background:#fef3c7;color:#b45309;' : 'background:#dbeafe;color:#2563eb;')">
                            <i th:class="${a.icon}"></i>
                        </div>
                        <div class="act-desc" th:text="${a.description}">Action</div>
                        <span class="act-time"
                            th:text="${#temporals.format(a.time, 'dd MMM yyyy, hh:mm a')}">Time</span>
                        <span class="act-type"
                            th:style="${a.type == 'CHECKIN'} ? 'background:#d1fae5;color:#065f46;' : (${a.type == 'CHECKOUT'} ? 'background:#fef3c7;color:#b45309;' : 'background:#dbeafe;color:#2563eb;')"
                            th:text="${a.type}">TYPE</span>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(activities)}"
                    style="text-align:center;padding:4rem;color:var(--text-muted);"><i class="fa-solid fa-chart-line"
                        style="font-size:3rem;display:block;margin-bottom:1rem;opacity:.3;"></i>
                    <p style="font-weight:600;">No activity recorded yet.</p>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
    <script>
        function filterAct(period) {
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            const now = new Date();
            document.querySelectorAll('.activity-item').forEach(item => {
                if (!period) { item.style.display = ''; return; }
                const t = new Date(item.dataset.time);
                const diff = (now - t) / (1000 * 60 * 60 * 24);
                if (period === 'today') item.style.display = diff < 1 ? '' : 'none';
                else if (period === 'week') item.style.display = diff < 7 ? '' : 'none';
                else if (period === 'month') item.style.display = diff < 30 ? '' : 'none';
            });
        }
    </script>
</body>

</html>
