<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline – ResolveIT Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .tl-container {
            position: relative;
            padding-left: 2rem;
            max-width: 700px;
        }

        .tl-container::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--border-color);
            border-radius: 2px;
        }

        .tl-item {
            position: relative;
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }

        .tl-dot {
            position: absolute;
            left: -2rem;
            top: .35rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .7rem;
            color: #fff;
            z-index: 2;
        }

        .tl-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            transition: box-shadow .2s;
        }

        .tl-card:hover {
            box-shadow: var(--shadow-sm);
        }

        .tl-desc {
            font-size: .9rem;
            font-weight: 500;
            margin-bottom: .25rem;
        }

        .tl-meta {
            font-size: .75rem;
            color: var(--text-muted);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
    </style>
</head>

<body data-theme="light">
    <div class="app-wrapper">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div style="display:flex;">
            <div th:replace="~{fragments/sidebar-staff :: sidebar('timeline')}"></div>
            <main class="main-container animate-fade">
                <div style="margin-bottom:2rem;">
                    <h1 style="font-size:1.875rem;font-weight:800;">Timeline</h1>
                    <p style="color:var(--text-muted);font-size:.9rem;margin-top:.25rem;">Chronological view of all
                        complaint activity.</p>
                </div>
                <div class="tl-container">
                    <div th:each="h : ${timeline}" class="tl-item">
                        <div class="tl-dot"
                            th:style="${h.status == 'Resolved'} ? 'background:#10b981;' : (${h.status == 'Denied'} ? 'background:#ef4444;' : (${h.status == 'In Progress'} ? 'background:#8b5cf6;' : (${h.status == 'Under Review'} ? 'background:#f59e0b;' : 'background:#2563eb;')))">
                            <i
                                th:class="${h.status == 'Resolved'} ? 'fa-solid fa-check' : (${h.status == 'Denied'} ? 'fa-solid fa-xmark' : 'fa-solid fa-arrows-rotate')"></i>
                        </div>
                        <div class="tl-card">
                            <p class="tl-desc" th:text="${h.description}">Activity</p>
                            <div class="tl-meta">
                                <span><i class="fa-solid fa-hashtag"></i> Complaint #<span
                                        th:text="${h.complaint.id}">0</span></span>
                                <span><i class="fa-solid fa-user"></i> <span
                                        th:text="${h.updatedBy}">Staff</span></span>
                                <span><i class="fa-solid fa-clock"></i> <span
                                        th:text="${#temporals.format(h.timestamp, 'dd MMM yyyy, hh:mm a')}">Time</span></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(timeline)}"
                    style="text-align:center;padding:4rem;color:var(--text-muted);">
                    <i class="fa-solid fa-clock-rotate-left"
                        style="font-size:3rem;display:block;margin-bottom:1rem;opacity:.3;"></i>
                    <p style="font-weight:600;">No activity yet.</p>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>

</html>
