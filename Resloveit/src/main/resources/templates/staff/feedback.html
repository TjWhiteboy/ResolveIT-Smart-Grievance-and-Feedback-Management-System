<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback – ResolveIT Staff</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .fb-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
            max-width: 400px;
        }

        .fb-stat {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .fb-stat .val {
            font-size: 2rem;
            font-weight: 800;
        }

        .fb-stat .lbl {
            font-size: .8rem;
            color: var(--text-muted);
            margin-top: .3rem;
        }

        .fb-table {
            width: 100%;
            border-collapse: collapse;
        }

        .fb-table thead th {
            padding: .75rem 1rem;
            font-size: .72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--text-muted);
            background: var(--bg-body);
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .fb-table tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: background .15s;
        }

        .fb-table tbody tr:hover {
            background: var(--bg-body);
        }

        .fb-table tbody td {
            padding: .85rem 1rem;
            font-size: .85rem;
            color: var(--text-main);
            vertical-align: middle;
        }

        .stars {
            color: #fbbf24;
            font-size: 1rem;
            letter-spacing: 2px;
        }
    </style>
</head>

<body data-theme="light">
    <div class="app-wrapper">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div style="display:flex;">
            <div th:replace="~{fragments/sidebar-staff :: sidebar('feedback')}"></div>
            <main class="main-container animate-fade">
                <div style="margin-bottom:2rem;">
                    <h1 style="font-size:1.875rem;font-weight:800;">Feedback</h1>
                    <p style="color:var(--text-muted);font-size:.9rem;margin-top:.25rem;">User feedback on your resolved
                        complaints.</p>
                </div>
                <div class="fb-stats">
                    <div class="fb-stat">
                        <div class="val" style="color:#fbbf24;" th:text="${avgRating}">N/A</div>
                        <div class="lbl">Avg Rating</div>
                    </div>
                    <div class="fb-stat">
                        <div class="val" style="color:var(--primary);" th:text="${feedbackCount}">0</div>
                        <div class="lbl">Total Reviews</div>
                    </div>
                </div>
                <div class="card" style="overflow-x:auto;">
                    <table class="fb-table">
                        <thead>
                            <tr>
                                <th>Complaint</th>
                                <th>User</th>
                                <th>Rating</th>
                                <th>Comment</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${feedbackList}">
                                <td style="font-weight:700;"><a th:href="@{/complaint/{id}(id=${f.complaint.id})}"
                                        style="color:var(--primary);text-decoration:none;"
                                        th:text="'#'+${f.complaint.id}+' '+${f.complaint.title}">Complaint</a></td>
                                <td th:text="${f.userName}">User</td>
                                <td><span class="stars"><span th:each="i : ${#numbers.sequence(1,5)}"><i
                                                th:class="${i <= f.feedback.rating} ? 'fa-solid fa-star' : 'fa-regular fa-star'"></i></span></span>
                                </td>
                                <td style="max-width:250px;color:var(--text-muted);"
                                    th:text="${f.feedback.comment != null ? f.feedback.comment : '—'}">Comment</td>
                                <td style="font-size:.8rem;color:var(--text-muted);white-space:nowrap;"
                                    th:text="${f.feedback.createdAt!=null ? #temporals.format(f.feedback.createdAt,'dd MMM yyyy') : '—'}">
                                    Date</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(feedbackList)}">
                                <td colspan="5" style="text-align:center;padding:3rem;color:var(--text-muted);"><i
                                        class="fa-solid fa-star"
                                        style="font-size:2rem;display:block;margin-bottom:1rem;opacity:.3;"></i>No
                                    feedback received yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/dashboard.js}"></script>
</body>

</html>
