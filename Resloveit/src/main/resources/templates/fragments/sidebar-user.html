<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-menu">
        <p class="sidebar-label">Main Menu</p>
        
        <a th:href="${userId != null} ? @{/my-complaints(userId=${userId})} : @{/my-complaints}" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
            <i class="fa-solid fa-gauge-high"></i>
            <span>Dashboard</span>
        </a>
        
        <a th:href="${userId != null} ? @{/complaint(user=${userId})} : @{/complaint}" class="sidebar-link" th:classappend="${activePage == 'new'} ? 'active' : ''">
            <i class="fa-solid fa-circle-plus"></i>
            <span>File New Complaint</span>
        </a>

        <a th:href="@{/user/notifications}" class="sidebar-link" th:classappend="${activePage == 'notifications'} ? 'active' : ''">
            <i class="fa-solid fa-bell"></i>
            <span>Notifications</span>
        </a>
        
        <p class="sidebar-label">Support</p>
        
        <a th:href="@{/help-center}" class="sidebar-link" th:classappend="${activePage == 'help'} ? 'active' : ''">
            <i class="fa-solid fa-circle-info"></i>
            <span>Help Center</span>
        </a>
        
        <a th:href="@{/contact-admin}" class="sidebar-link" th:classappend="${activePage == 'contact'} ? 'active' : ''">
            <i class="fa-solid fa-message"></i>
            <span>Contact Admin</span>
        </a>
        <a th:href="@{/messages/history}" class="sidebar-link" th:classappend="${activePage == 'history'} ? 'active' : ''">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Message History</span>
        </a>
    </div>
    
    <div class="sidebar-footer">
        <!-- User Sidebar Card -->
        <div th:if="${activePage != 'profile'}" class="user-sidebar-card">
            <div class="user-avatar-small">
                <img th:if="${user != null and user.profilePicturePath != null}" th:src="${user.profilePicturePath}" alt="PFP">
                <span th:unless="${user != null and user.profilePicturePath != null}" th:text="${userName != null ? #strings.substring(userName,0,1) : 'U'}">U</span>
            </div>
            <div class="user-details">
                <p class="user-name" th:text="${userName}">User Name</p>
                <p class="user-role" th:text="${user != null ? user.role : 'Member'}">Standard</p>
            </div>
            <a th:href="@{/profile}" class="user-settings-btn" title="My Profile">
                <i class="fa-solid fa-cog"></i>
            </a>
        </div>

        <div class="status-card">
            <div class="status-dot"></div>
            <span>System Operational</span>
        </div>
    </div>
</aside>

</body>
</html>
